[project]
name = "worldcanon"
version = "0.1.0"
description = "Sidecar for the Worldbuilder Canon Obsidian companion."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "sqlite-vec>=0.1.9",
  "fastembed>=0.4",
  "numpy>=1.26",
  "watchdog>=4.0",
  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
worldcanon-sidecar = "worldcanon.main:main"
worldcanon-import = "worldcanon.import_cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["server"]
include = ["worldcanon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
