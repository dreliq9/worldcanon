name: Build Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project
        run: |
          python -m venv .venv
          .\.venv\Scripts\Activate.ps1
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyinstaller>=6.0
        shell: pwsh

      - name: Build sidecar
        run: |
          .\.venv\Scripts\Activate.ps1
          pyinstaller pyinstaller/sidecar.spec
        shell: pwsh

      - name: Build importer
        run: |
          .\.venv\Scripts\Activate.ps1
          pyinstaller pyinstaller/importer.spec
        shell: pwsh

      - name: Smoke-test built binaries
        run: |
          # Importer is a single binary with no dependencies — --help is enough.
          .\dist\worldcanon-import.exe --help

          # Force the env var into Process scope. $env:X works in pwsh 7 by
          # convention but is not a documented guarantee for child-process
          # inheritance via Start-Process; the explicit form is safer.
          [Environment]::SetEnvironmentVariable("WORLDCANON_EMBEDDER", "hash", "Process")

          # Pass an absolute vault path so the child's CWD doesn't matter.
          # Start-Process can't take -WorkingDirectory together with our
          # other flags without quoting headaches; absolute path sidesteps it.
          $vaultPath = (Resolve-Path starter-vault).Path

          $proc = Start-Process `
            -FilePath ".\dist\worldcanon-sidecar\worldcanon-sidecar.exe" `
            -ArgumentList "--vault",$vaultPath,"--port","7777","--log-level","info" `
            -RedirectStandardOutput sidecar-out.log `
            -RedirectStandardError sidecar-err.log `
            -PassThru -NoNewWindow

          $ok = $false
          $crashed = $false
          $reason = ""
          for ($i = 1; $i -le 60; $i++) {
            Start-Sleep -Seconds 1
            if ($proc.HasExited) {
              $crashed = $true
              $reason = "sidecar exited after $i second(s) with code $($proc.ExitCode)"
              break
            }
            try {
              $r = Invoke-WebRequest -Uri http://127.0.0.1:7777/stats -TimeoutSec 2 -UseBasicParsing
              if ($r.StatusCode -eq 200) {
                # Verify the indexer actually ran — empty /stats is a regression
                # the bare HTTP 200 check would otherwise let slip.
                $stats = $r.Content | ConvertFrom-Json
                $totalChunks = ($stats.corpora | Measure-Object -Property chunk_count -Sum).Sum
                if ($totalChunks -gt 0) {
                  Write-Host "Sidecar bound port 7777 after $i second(s); indexed $totalChunks chunks across $($stats.corpora.Count) corpora."
                  Write-Host $r.Content
                  $ok = $true
                } else {
                  $reason = "/stats responded but no chunks were indexed"
                }
                break
              }
            } catch {
              # not up yet
            }
          }
          if (-not $ok -and -not $crashed -and -not $reason) {
            $reason = "sidecar never bound port 7777 within 60 seconds"
          }

          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 1

          Write-Host "--- sidecar stdout ---"
          Get-Content sidecar-out.log -ErrorAction SilentlyContinue
          Write-Host "--- sidecar stderr ---"
          Get-Content sidecar-err.log -ErrorAction SilentlyContinue

          if (-not $ok) {
            Write-Host "FAIL: $reason" -ForegroundColor Red
            exit 1
          }
        shell: pwsh

      - name: Assemble release folder
        run: |
          New-Item -ItemType Directory -Path dist\release -Force | Out-Null
          Copy-Item dist\worldcanon-sidecar dist\release\worldcanon-sidecar -Recurse
          Copy-Item dist\worldcanon-import.exe dist\release\
          Copy-Item scripts\install.ps1 dist\release\
          Copy-Item scripts\install.cmd dist\release\
          Copy-Item scripts\uninstall.ps1 dist\release\
          Copy-Item scripts\uninstall.cmd dist\release\
          Copy-Item scripts\diagnose.ps1 dist\release\
          Copy-Item scripts\diagnose.cmd dist\release\
          Copy-Item INSTALL.md dist\release\
          Copy-Item starter-vault dist\release\starter-vault -Recurse
          Compress-Archive -Path dist\release\* -DestinationPath dist\worldcanon-windows-x64.zip
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: worldcanon-windows-x64
          path: dist/worldcanon-windows-x64.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/worldcanon-windows-x64.zip
